AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless backend for the Jung Younghoon memorial site

Parameters:
  AdminEmail:
    Type: String
    Default: sung.gpslgx@gmail.com
  ExistingBucketName:
    Type: String
    Default: father-memorial-media-905418126737
  ExistingNetlifyIamUser:
    Type: String
    Default: father-memorial-netlify-uploader
  ImageProcessorCodeKey:
    Type: String
    Default: infrastructure/image-processor.zip

Resources:
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: father-memorial-content
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: father-memorial

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: father-memorial-admins
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        Project: father-memorial

  AdminAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: father-memorial-netlify-admin
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Full memorial site administrators
      UserPoolId: !Ref AdminUserPool
      Precedence: 1

  FamilyManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: family
      Description: Family managers who can upload, edit, and approve memorial content
      UserPoolId: !Ref AdminUserPool
      Precedence: 2

  ReviewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: reviewer
      Description: Review assistants who can inspect and suggest metadata without final approval
      UserPoolId: !Ref AdminUserPool
      Precedence: 3

  InitialAdmin:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      Username: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      ForceAliasCreation: false
      UserPoolId: !Ref AdminUserPool
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: 'true'

  InitialAdminGroupAttachment:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DependsOn: InitialAdmin
    Properties:
      GroupName: !Ref AdminGroup
      Username: !Ref InitialAdmin
      UserPoolId: !Ref AdminUserPool

  NetlifyBackendPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: FatherMemorialNetlifyBackend
      Description: Least privilege access for memorial Netlify functions
      Users:
        - !Ref ExistingNetlifyIamUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListMemorialObjects
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}
            Condition:
              StringLike:
                s3:prefix:
                  - pending/*
                  - published/*
                  - web/*
                  - thumb/*
          - Sid: ReadAndWriteMemorialObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/pending/*
              - !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/published/*
              - !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/web/*
              - !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/thumb/*
          - Sid: MemorialContentTable
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt ContentTable.Arn
              - !Sub ${ContentTable.Arn}/index/*
          - Sid: QueueApprovedImages
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt ImageProcessingQueue.Arn

  ImageProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: father-memorial-image-processing-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: father-memorial

  ImageProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: father-memorial-image-processing
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImageProcessingDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: father-memorial

  ImageProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FatherMemorialImageProcessorRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessMemorialImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/published/*
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/web/*
                  - !Sub arn:${AWS::Partition}:s3:::${ExistingBucketName}/thumb/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ContentTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ImageProcessingQueue.Arn

  ImageProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: father-memorial-image-processor
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: handler.lambda_handler
      Role: !GetAtt ImageProcessorRole.Arn
      MemorySize: 2048
      Timeout: 120
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref ExistingBucketName
        S3Key: !Ref ImageProcessorCodeKey
      Environment:
        Variables:
          MEMORIAL_S3_BUCKET: !Ref ExistingBucketName
          MEMORIAL_DYNAMODB_TABLE: !Ref ContentTable
      Tags:
        - Key: Project
          Value: father-memorial

  ImageProcessorQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ImageProcessingQueue.Arn
      FunctionName: !Ref ImageProcessorFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

Outputs:
  ContentTableName:
    Value: !Ref ContentTable
  CognitoUserPoolId:
    Value: !Ref AdminUserPool
  CognitoAppClientId:
    Value: !Ref AdminAppClient
  AdminEmail:
    Value: !Ref AdminEmail
  ImageProcessingQueueUrl:
    Value: !Ref ImageProcessingQueue
  ImageProcessingQueueArn:
    Value: !GetAtt ImageProcessingQueue.Arn
  ImageProcessingDeadLetterQueueUrl:
    Value: !Ref ImageProcessingDeadLetterQueue
  ImageProcessorFunctionName:
    Value: !Ref ImageProcessorFunction
